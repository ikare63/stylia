<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e8" />
  <title>Stylia — Accordeur de tenue</title>
  <style>
    :root{
      --bg:#f7f2e8;
      --paper:#fffdf8;
      --ink:#1f1f1f;
      --muted:#72706b;
      --line:#ddd5c8;
      --accent:#272727;
      --shadow:0 18px 55px rgba(67,54,34,.12);
      --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}
    body{
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.86), transparent 28rem),
        linear-gradient(180deg,#faf6ee 0%,#f3ede2 100%);
    }
    .app{width:min(1120px,100%);margin:auto;min-height:100dvh;padding:18px 18px 34px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .brand{display:flex;align-items:center;gap:11px}
    .mark{width:42px;height:42px;border-radius:14px;background:#1f1f1f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
    .brand h1{font-size:25px;line-height:1;margin:0;letter-spacing:-.7px}
    .brand small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
    .top-actions{display:flex;gap:8px}
    .icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.65);border-radius:999px;padding:10px 13px;color:var(--ink);cursor:pointer}
    .shell{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px}
    .panel{background:rgba(255,253,248,.91);border:1px solid rgba(215,206,193,.88);box-shadow:var(--shadow);border-radius:var(--radius)}
    .quiz{padding:24px}
    .visual{padding:22px;position:sticky;top:16px;height:fit-content;overflow:hidden}
    .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .question{font-size:clamp(28px,4vw,46px);line-height:1.02;letter-spacing:-1.8px;margin:8px 0 8px;max-width:760px}
    .sub{color:var(--muted);margin:0 0 22px;font-size:15px}
    .progress{display:flex;gap:7px;margin:0 0 24px}
    .progress i{height:5px;border-radius:99px;background:#e5ddd0;flex:1;overflow:hidden}
    .progress i.on{background:#252525}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .choice{
      border:1px solid var(--line);background:#fffdfa;border-radius:17px;
      padding:16px 13px;text-align:left;cursor:pointer;min-height:72px;
      display:flex;align-items:center;gap:11px;transition:.18s ease;
    }
    .choice:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(53,45,31,.09)}
    .choice.selected{border-color:#222;box-shadow:inset 0 0 0 1px #222;background:#fff}
    .choice strong{display:block;font-size:15px}
    .choice span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .swatch{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
    .piece-icon{width:32px;height:32px;display:grid;place-items:center;font-size:24px}
    .shade-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
    .back,.next,.restart{
      border:0;border-radius:15px;padding:13px 17px;cursor:pointer;font-weight:700
    }
    .back{background:#eee8de;color:#3c3a36}
    .next{background:#222;color:#fff;min-width:140px}
    .next:disabled{opacity:.35;cursor:not-allowed}
    .hidden{display:none!important}

    .figure-wrap{
      min-height:430px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(145deg,#faf7f0,#eee7db);border-radius:20px;position:relative
    }
    .figure-wrap:before{
      content:"";position:absolute;width:230px;height:230px;border-radius:50%;
      background:rgba(255,255,255,.65);filter:blur(2px)
    }
    .mannequin{width:205px;height:385px;position:relative;z-index:1}
    .head{position:absolute;left:80px;top:12px;width:45px;height:53px;border-radius:45% 45% 48% 48%;background:#d6b697}
    .neck{position:absolute;left:94px;top:57px;width:18px;height:24px;background:#d6b697;border-radius:4px}
    .torso{position:absolute;left:54px;top:74px;width:98px;height:125px;border-radius:28px 28px 18px 18px;background:#ece9e3;border:1px solid rgba(0,0,0,.07);overflow:hidden}
    .arm{position:absolute;top:83px;width:23px;height:135px;background:#d6b697;border-radius:15px}
    .arm.left{left:31px;transform:rotate(5deg)}
    .arm.right{right:31px;transform:rotate(-5deg)}
    .bottom{position:absolute;left:53px;top:188px;width:100px;height:82px;border-radius:9px 9px 17px 17px;background:#ddd;border:1px solid rgba(0,0,0,.08)}
    .leg{position:absolute;top:256px;width:32px;height:105px;background:#d6b697;border-radius:10px}
    .leg.left{left:63px}.leg.right{right:63px}
    .shoe{position:absolute;top:346px;width:53px;height:22px;border-radius:18px 18px 8px 8px;background:#f4f4f4;border:1px solid rgba(0,0,0,.12)}
    .shoe.left{left:43px}.shoe.right{right:43px}
    .garment-label{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:10px 12px;font-size:13px;text-align:center;z-index:3}
    .mini-title{font-weight:800;margin:0 0 4px}
    .mini-sub{color:var(--muted);margin:0;font-size:12px}
    .tagline{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .tag{font-size:11px;padding:6px 9px;border-radius:999px;background:#eee8de;color:#58534a}

    .results{display:grid;gap:10px}
    .result-card{
      border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;
      display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer;transition:.18s ease
    }
    .result-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(53,45,31,.08)}
    .result-card .rank{font-size:12px;color:var(--muted);font-weight:700;width:22px}
    .result-main{display:flex;align-items:center;gap:10px}
    .result-text strong{display:block}
    .result-text small{color:var(--muted)}
    .arrow{font-size:20px;color:#8f897f}
    .result-swatch{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.13)}

    .outfit-summary{display:grid;gap:10px;margin-top:16px}
    .slot{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px dashed #d4cbbc;border-radius:14px;color:var(--muted);font-size:13px}
    .slot.filled{border-style:solid;background:#fff;color:var(--ink)}
    .slot-dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
    .restart{margin-top:14px;width:100%;background:#222;color:#fff}

    .toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,30px);opacity:0;background:#222;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;transition:.25s ease;pointer-events:none;z-index:20}
    .toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:820px){
      .app{padding:12px 12px 28px}
      .shell{grid-template-columns:1fr}
      .visual{position:relative;top:auto;order:-1;padding:14px}
      .figure-wrap{min-height:270px}
      .mannequin{transform:scale(.64)}
      .visual .figure-wrap{height:270px}
      .quiz{padding:18px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .question{font-size:32px}
    }
    @media(max-width:420px){
      .brand small{display:none}
      .quiz{padding:16px}
      .choice{padding:13px 11px;min-height:64px}
      .question{font-size:29px}
      .grid{gap:8px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">S</div>
      <div><h1>Stylia</h1><small>Accordeur de tenue</small></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="savedBtn" title="Tenues enregistrées">♡</button>
      <button class="icon-btn" id="resetTop" title="Recommencer">↺</button>
    </div>
  </header>

  <main class="shell">
    <section class="panel quiz">
      <div class="progress" id="progress"></div>
      <div class="eyebrow" id="eyebrow">Étape 1</div>
      <h2 class="question" id="question">Qu’est-ce que tu veux porter aujourd’hui&nbsp;?</h2>
      <p class="sub" id="sub">Choisis la pièce de départ de ta tenue.</p>
      <div id="choices" class="grid"></div>
      <div id="results" class="results hidden"></div>
      <div class="nav">
        <button class="back hidden" id="back">← Retour</button>
        <button class="next" id="next" disabled>Continuer</button>
      </div>
    </section>

    <aside class="panel visual">
      <div class="eyebrow">Aperçu</div>
      <div class="figure-wrap" style="margin-top:10px">
        <div class="mannequin">
          <div class="head"></div><div class="neck"></div>
          <div class="arm left"></div><div class="arm right"></div>
          <div class="torso" id="torso"></div>
          <div class="bottom" id="bottom"></div>
          <div class="leg left"></div><div class="leg right"></div>
          <div class="shoe left" id="shoeL"></div><div class="shoe right" id="shoeR"></div>
        </div>
        <div class="garment-label">
          <p class="mini-title" id="lookTitle">Ta tenue prend forme</p>
          <p class="mini-sub" id="lookSub">Commence par choisir une pièce.</p>
        </div>
      </div>
      <div class="tagline" id="tags"></div>
      <div class="outfit-summary" id="outfitSummary"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast">Tenue enregistrée</div>

<script>
const pieces = [
  {id:'tshirt',label:'T-shirt',group:'top',icon:'👕'},
  {id:'tank',label:'Débardeur',group:'top',icon:'◻️'},
  {id:'shirt',label:'Chemise',group:'top',icon:'👔'},
  {id:'polo',label:'Polo',group:'top',icon:'👕'},
  {id:'sweater',label:'Pull / sweat',group:'top',icon:'🧥'},
  {id:'jacket',label:'Veste',group:'outer',icon:'🧥'},
  {id:'pants',label:'Pantalon',group:'bottom',icon:'👖'},
  {id:'jeans',label:'Jean',group:'bottom',icon:'👖'},
  {id:'shorts',label:'Short',group:'bottom',icon:'🩳'}
];

const families = {
  'Noir': {'Noir':'#1f1f1f','Noir délavé':'#3f4142'},
  'Blanc': {'Blanc':'#f8f8f5','Écru':'#eee5cf','Crème':'#f3e6c8'},
  'Gris': {'Gris clair':'#c7c8c5','Gris moyen':'#8e9191','Anthracite':'#4d5051'},
  'Beige': {'Sable':'#d8c3a5','Taupe':'#a9957e','Lin':'#d9ccb4'},
  'Marron': {'Camel':'#b77943','Cognac':'#9a582f','Chocolat':'#5b3928','Noisette':'#846044'},
  'Rouge': {'Écarlate':'#d9272e','Carmin':'#a4192d','Bordeaux':'#6f2231','Brique':'#a84734','Grenat':'#671f2a'},
  'Orange': {'Orange':'#e8782d','Terracotta':'#b85f42','Rouille':'#9c4d2e','Corail':'#e87768'},
  'Jaune': {'Citron':'#f0df35','Jaune pâle':'#eee0a2','Moutarde':'#b68a2e','Ocre':'#c58b35','Doré':'#c79a38'},
  'Vert': {'Kaki':'#72734d','Olive':'#7b7c43','Forêt':'#244c37','Sauge':'#9ca78c','Menthe':'#b8d5c0'},
  'Bleu': {'Bleu marine':'#24364b','Bleu ciel':'#9ec8e2','Bleu roi':'#3158a2','Bleu pétrole':'#2c606a','Denim':'#55758e'},
  'Violet': {'Prune':'#6f3f62','Aubergine':'#513143','Lilas':'#b9a4cf','Lavande':'#a69bc9'},
  'Rose': {'Rose poudré':'#d7aaa8','Vieux rose':'#b98282','Fuchsia':'#c22f7b','Saumon':'#e68c7a'}
};
const familyHex = {
  'Noir':'#1f1f1f','Blanc':'#f8f8f5','Gris':'#9a9c9b','Beige':'#d8c3a5','Marron':'#79513a',
  'Rouge':'#c62d36','Orange':'#dc742d','Jaune':'#d4aa31','Vert':'#64764b','Bleu':'#4a78a8','Violet':'#76608f','Rose':'#ca7d91'
};

const pairings = {
  'Moutarde':['Blanc','Bleu','Beige','Vert','Rouge','Noir','Gris','Marron'],
  'Ocre':['Blanc','Bleu','Beige','Marron','Vert','Noir','Rouge'],
  'Citron':['Blanc','Bleu','Gris','Noir','Vert','Beige'],
  'Jaune pâle':['Blanc','Bleu','Beige','Gris','Vert','Rose'],
  'Doré':['Noir','Blanc','Bleu','Marron','Beige','Vert'],
  'Écarlate':['Blanc','Bleu','Noir','Gris','Beige','Marron'],
  'Bordeaux':['Blanc','Beige','Bleu','Gris','Noir','Vert','Marron'],
  'Carmin':['Blanc','Bleu','Beige','Noir','Gris','Marron'],
  'Brique':['Blanc','Beige','Bleu','Vert','Marron','Noir'],
  'Grenat':['Blanc','Beige','Bleu','Gris','Noir','Vert'],
  'Bleu marine':['Blanc','Beige','Marron','Jaune','Rouge','Vert','Gris'],
  'Bleu ciel':['Blanc','Beige','Bleu','Marron','Gris','Jaune','Rose'],
  'Bleu roi':['Blanc','Beige','Gris','Noir','Marron','Rouge'],
  'Bleu pétrole':['Blanc','Beige','Marron','Gris','Jaune','Vert'],
  'Denim':['Blanc','Beige','Marron','Gris','Rouge','Vert','Jaune','Noir'],
  'Kaki':['Blanc','Beige','Marron','Noir','Gris','Bleu','Rouge'],
  'Olive':['Blanc','Beige','Marron','Noir','Bleu','Rouge'],
  'Forêt':['Blanc','Beige','Marron','Gris','Bleu','Rouge'],
  'Sauge':['Blanc','Beige','Marron','Gris','Rose','Bleu'],
  'Menthe':['Blanc','Beige','Gris','Bleu','Rose'],
  'Camel':['Blanc','Bleu','Noir','Vert','Beige','Rouge','Gris'],
  'Cognac':['Blanc','Bleu','Beige','Vert','Noir','Gris'],
  'Chocolat':['Blanc','Beige','Bleu','Vert','Gris','Rose'],
  'Noisette':['Blanc','Beige','Bleu','Vert','Gris'],
  'Noir':['Blanc','Gris','Beige','Rouge','Bleu','Vert','Jaune','Rose','Violet','Orange','Marron'],
  'Noir délavé':['Blanc','Gris','Beige','Bleu','Rouge','Vert','Marron'],
  'Blanc':['Bleu','Noir','Beige','Marron','Vert','Rouge','Jaune','Rose','Violet','Orange','Gris'],
  'Écru':['Bleu','Marron','Vert','Beige','Rouge','Jaune','Gris','Noir'],
  'Crème':['Marron','Bleu','Vert','Beige','Rouge','Jaune','Gris'],
  'Gris clair':['Blanc','Bleu','Noir','Rouge','Vert','Rose','Marron','Jaune'],
  'Gris moyen':['Blanc','Bleu','Noir','Rouge','Vert','Beige','Marron'],
  'Anthracite':['Blanc','Beige','Bleu','Rouge','Vert','Rose','Jaune'],
  'Sable':['Blanc','Bleu','Marron','Vert','Noir','Rouge','Jaune'],
  'Taupe':['Blanc','Bleu','Marron','Vert','Noir','Rose'],
  'Lin':['Blanc','Bleu','Marron','Vert','Rouge','Jaune'],
  'Orange':['Blanc','Bleu','Beige','Marron','Noir','Vert'],
  'Terracotta':['Blanc','Beige','Bleu','Vert','Marron','Noir'],
  'Rouille':['Blanc','Beige','Bleu','Vert','Marron','Noir'],
  'Corail':['Blanc','Beige','Bleu','Gris','Vert'],
  'Prune':['Blanc','Beige','Gris','Noir','Bleu','Rose'],
  'Aubergine':['Blanc','Beige','Gris','Noir','Bleu','Vert'],
  'Lilas':['Blanc','Gris','Beige','Bleu','Rose'],
  'Lavande':['Blanc','Gris','Beige','Bleu','Rose'],
  'Rose poudré':['Blanc','Beige','Gris','Bleu','Marron','Vert'],
  'Vieux rose':['Blanc','Beige','Gris','Bleu','Marron','Vert'],
  'Fuchsia':['Blanc','Noir','Gris','Bleu','Beige'],
  'Saumon':['Blanc','Beige','Bleu','Gris','Vert']
};

const preferredShades = {
  'Blanc':['Blanc','Écru','Crème'],
  'Bleu':['Bleu marine','Bleu ciel','Denim','Bleu pétrole','Bleu roi'],
  'Beige':['Lin','Sable','Taupe'],
  'Vert':['Kaki','Sauge','Olive','Forêt','Menthe'],
  'Rouge':['Bordeaux','Brique','Grenat','Carmin','Écarlate'],
  'Noir':['Noir','Noir délavé'],
  'Gris':['Gris clair','Anthracite','Gris moyen'],
  'Marron':['Camel','Cognac','Noisette','Chocolat'],
  'Jaune':['Moutarde','Ocre','Jaune pâle','Doré','Citron'],
  'Rose':['Rose poudré','Vieux rose','Saumon','Fuchsia'],
  'Violet':['Prune','Lavande','Lilas','Aubergine'],
  'Orange':['Terracotta','Rouille','Corail','Orange']
};

const targets = [
  {id:'top',label:'Un haut',desc:'T-shirt, chemise, débardeur…',icon:'👕'},
  {id:'bottom',label:'Un bas',desc:'Pantalon, jean, short…',icon:'👖'},
  {id:'shoes',label:'Des chaussures',desc:'Pour finir la base',icon:'👟'},
  {id:'outer',label:'Une veste',desc:'Surchemise, veste, blouson…',icon:'🧥'},
  {id:'full',label:'Une tenue complète',desc:'Stylia compose tout',icon:'✨'}
];

const state = {step:0,piece:null,family:null,shade:null,target:null,outfit:{}};
const els = {
  progress:document.getElementById('progress'), eyebrow:document.getElementById('eyebrow'),
  question:document.getElementById('question'), sub:document.getElementById('sub'),
  choices:document.getElementById('choices'), results:document.getElementById('results'),
  back:document.getElementById('back'), next:document.getElementById('next'),
  torso:document.getElementById('torso'), bottom:document.getElementById('bottom'),
  shoeL:document.getElementById('shoeL'), shoeR:document.getElementById('shoeR'),
  lookTitle:document.getElementById('lookTitle'), lookSub:document.getElementById('lookSub'),
  tags:document.getElementById('tags'), outfitSummary:document.getElementById('outfitSummary'),
  toast:document.getElementById('toast')
};

function initProgress(){
  els.progress.innerHTML='';
  for(let i=0;i<5;i++){ const x=document.createElement('i'); if(i<=state.step)x.className='on'; els.progress.appendChild(x);}
}
function pieceById(id){return pieces.find(p=>p.id===id)}
function familyOfShade(shade){
  return Object.keys(families).find(f=>Object.keys(families[f]).includes(shade));
}
function hexOfShade(shade){
  if(!shade)return '#e7e4de';
  const f=familyOfShade(shade); return f?families[f][shade]:'#e7e4de';
}
function contrastText(hex){
  const c=hex.replace('#',''); const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (r*299+g*587+b*114)/1000>155?'#222':'#fff';
}
function labelPiece(piece){
  return piece?.label || '';
}
function setBaseOutfit(){
  const p=pieceById(state.piece); if(!p||!state.shade)return;
  state.outfit[p.group]={piece:p.label,shade:state.shade};
}
function updateFigure(){
  const top=state.outfit.top, bottom=state.outfit.bottom, shoes=state.outfit.shoes, outer=state.outfit.outer;
  els.torso.style.background=top?hexOfShade(top.shade):'#ece9e3';
  els.bottom.style.background=bottom?hexOfShade(bottom.shade):'#dddddd';
  const shoeHex=shoes?hexOfShade(shoes.shade):'#f4f4f4';
  els.shoeL.style.background=shoeHex; els.shoeR.style.background=shoeHex;
  if(outer){
    els.torso.style.boxShadow=`inset 10px 0 0 ${hexOfShade(outer.shade)}, inset -10px 0 0 ${hexOfShade(outer.shade)}`;
  }else els.torso.style.boxShadow='none';

  const filled=[top,bottom,outer,shoes].filter(Boolean);
  if(filled.length){
    els.lookTitle.textContent=filled.length>=3?'Ta tenue Stylia':'Ta tenue prend forme';
    els.lookSub.textContent=filled.map(x=>`${x.piece} ${x.shade.toLowerCase()}`).join(' · ');
  } else {
    els.lookTitle.textContent='Ta tenue prend forme';
    els.lookSub.textContent='Commence par choisir une pièce.';
  }
  els.tags.innerHTML='';
  filled.forEach(x=>{
    const t=document.createElement('span'); t.className='tag'; t.textContent=x.shade; els.tags.appendChild(t);
  });
  renderOutfitSummary();
}
function renderOutfitSummary(){
  const order=[['top','Haut'],['bottom','Bas'],['outer','Veste'],['shoes','Chaussures']];
  els.outfitSummary.innerHTML='';
  order.forEach(([key,label])=>{
    const v=state.outfit[key];
    const div=document.createElement('div');
    div.className='slot'+(v?' filled':'');
    if(v){
      div.innerHTML=`<span class="slot-dot" style="background:${hexOfShade(v.shade)}"></span><strong>${label}</strong>&nbsp; ${v.piece} · ${v.shade}`;
    } else div.innerHTML=`<span>＋</span> ${label}`;
    els.outfitSummary.appendChild(div);
  });
  if(Object.values(state.outfit).filter(Boolean).length>=2){
    const b=document.createElement('button'); b.className='restart'; b.textContent='♡ Enregistrer cette tenue';
    b.onclick=saveOutfit; els.outfitSummary.appendChild(b);
  }
}
function saveOutfit(){
  const arr=JSON.parse(localStorage.getItem('stylia_saved')||'[]');
  arr.unshift({date:new Date().toISOString(),outfit:JSON.parse(JSON.stringify(state.outfit))});
  localStorage.setItem('stylia_saved',JSON.stringify(arr.slice(0,20)));
  showToast('Tenue enregistrée');
}
function showToast(text){
  els.toast.textContent=text; els.toast.classList.add('show'); setTimeout(()=>els.toast.classList.remove('show'),1800);
}
function cardChoice({id,label,desc='',icon=null,swatch=null}, selected, onClick){
  const b=document.createElement('button'); b.className='choice'+(selected?' selected':'');
  b.innerHTML=(swatch?`<span class="swatch" style="background:${swatch}"></span>`:`<span class="piece-icon">${icon||'•'}</span>`)
    +`<span><strong>${label}</strong>${desc?`<span>${desc}</span>`:''}</span>`;
  b.onclick=()=>onClick(id); return b;
}
function renderStep(){
  initProgress(); els.results.classList.add('hidden'); els.choices.classList.remove('hidden'); els.choices.innerHTML='';
  els.back.classList.toggle('hidden',state.step===0);
  els.next.classList.remove('hidden');
  els.next.disabled=true;
  els.choices.className='grid';

  if(state.step===0){
    els.eyebrow.textContent='Étape 1';
    els.question.textContent='Qu’est-ce que tu veux porter aujourd’hui ?';
    els.sub.textContent='Choisis la pièce autour de laquelle tu veux construire ta tenue.';
    pieces.forEach(p=>els.choices.appendChild(cardChoice(p,state.piece===p.id,id=>{
      state.piece=id; [...els.choices.children].forEach((c,i)=>c.classList.toggle('selected',pieces[i].id===id)); els.next.disabled=false;
    })));
    els.next.disabled=!state.piece;
  }
  if(state.step===1){
    els.eyebrow.textContent='Étape 2';
    els.question.textContent='Quelle est sa couleur ?';
    els.sub.textContent='On commence simple : choisis la grande famille de couleur.';
    Object.keys(families).forEach(f=>els.choices.appendChild(cardChoice({id:f,label:f,swatch:familyHex[f]},state.family===f,id=>{
      state.family=id; state.shade=null; [...els.choices.children].forEach((c,i)=>c.classList.toggle('selected',Object.keys(families)[i]===id)); els.next.disabled=false;
    })));
    els.next.disabled=!state.family;
  }
  if(state.step===2){
    els.eyebrow.textContent='Étape 3';
    els.question.textContent='Quelle nuance exactement ?';
    els.sub.textContent=`Tu as choisi ${state.family.toLowerCase()}. Affine maintenant la couleur.`;
    els.choices.classList.add('shade-grid');
    const shades=Object.keys(families[state.family]);
    shades.forEach(s=>els.choices.appendChild(cardChoice({id:s,label:s,swatch:families[state.family][s]},state.shade===s,id=>{
      state.shade=id; [...els.choices.children].forEach((c,i)=>c.classList.toggle('selected',shades[i]===id)); els.next.disabled=false;
      setBaseOutfit(); updateFigure();
    })));
    els.next.disabled=!state.shade;
  }
  if(state.step===3){
    els.eyebrow.textContent='Étape 4';
    els.question.textContent='Qu’est-ce que tu veux accorder avec ?';
    els.sub.textContent=`Stylia va partir de ton ${labelPiece(pieceById(state.piece)).toLowerCase()} ${state.shade.toLowerCase()}.`;
    const baseGroup=pieceById(state.piece).group;
    targets.filter(t=>t.id!==baseGroup).forEach(t=>els.choices.appendChild(cardChoice(t,state.target===t.id,id=>{
      state.target=id; renderStep();
    })));
    els.next.disabled=!state.target;
  }
  if(state.step===4){ renderResults(); }
  updateFigure();
}

function candidatesFor(target){
  const basePiece=pieceById(state.piece);
  let kinds=[];
  if(target==='top') kinds=['T-shirt','Débardeur','Chemise','Polo'];
  if(target==='bottom') kinds=['Pantalon','Jean','Short'];
  if(target==='outer') kinds=['Surchemise','Veste','Blouson'];
  if(target==='shoes') kinds=['Baskets','Mocassins','Sandales'];
  const famOrder=pairings[state.shade] || ['Blanc','Bleu','Beige','Noir','Gris','Marron','Vert'];
  let items=[];
  famOrder.slice(0,7).forEach((fam,fi)=>{
    const shadeList=preferredShades[fam]||Object.keys(families[fam]||{});
    const shade=shadeList[0];
    kinds.forEach((kind,ki)=>{
      if(target==='shoes' && !['Blanc','Beige','Marron','Noir','Bleu','Gris'].includes(fam)) return;
      items.push({group:target,piece:kind,shade,family:fam,order:fi*10+ki});
    });
  });
  // Specific strong combinations
  if(state.shade==='Moutarde'){
    const strong = target==='top' ? [
      {piece:'T-shirt',shade:'Blanc'},{piece:'T-shirt',shade:'Bleu marine'},
      {piece:'Chemise',shade:'Écru'},{piece:'Chemise',shade:'Bleu ciel'},
      {piece:'Débardeur',shade:'Blanc'},{piece:'T-shirt',shade:'Kaki'},
      {piece:'T-shirt',shade:'Bordeaux'}
    ] : target==='shoes' ? [
      {piece:'Baskets',shade:'Blanc'},{piece:'Baskets',shade:'Écru'},
      {piece:'Mocassins',shade:'Cognac'},{piece:'Baskets',shade:'Bleu marine'},
      {piece:'Sandales',shade:'Camel'}
    ] : target==='outer' ? [
      {piece:'Surchemise',shade:'Bleu marine'},{piece:'Veste',shade:'Écru'},
      {piece:'Surchemise',shade:'Kaki'},{piece:'Veste',shade:'Denim'}
    ] : [];
    if(strong.length) items=strong.map((x,i)=>({...x,group:target,order:i}));
  }
  return items.sort((a,b)=>a.order-b.order).slice(0,9);
}
function renderResults(){
  els.choices.classList.add('hidden'); els.results.classList.remove('hidden'); els.results.innerHTML='';
  els.next.classList.add('hidden'); els.back.classList.remove('hidden');
  els.eyebrow.textContent='Résultats';
  if(state.target==='full'){
    els.question.textContent='Voici les accords les plus naturels';
    els.sub.textContent='Touchez une proposition pour l’appliquer à la silhouette.';
    const order=['top','outer','shoes'];
    const baseGroup=pieceById(state.piece).group;
    const needed=order.filter(g=>g!==baseGroup);
    const full=[];
    needed.forEach(g=>full.push(...candidatesFor(g).slice(0,3)));
    full.forEach((item,i)=>addResultCard(item,i));
  } else {
    const labels={top:'hauts',bottom:'bas',outer:'vestes',shoes:'chaussures'};
    els.question.textContent=`Les ${labels[state.target]} qui vont le mieux`;
    els.sub.textContent=`Avec ton ${labelPiece(pieceById(state.piece)).toLowerCase()} ${state.shade.toLowerCase()}, je commencerais par ceux-ci.`;
    candidatesFor(state.target).forEach((item,i)=>addResultCard(item,i));
  }
}
function addResultCard(item,i){
  const div=document.createElement('button'); div.className='result-card';
  div.innerHTML=`<span class="rank">${i+1}</span>
    <span class="result-main">
      <span class="result-swatch" style="background:${hexOfShade(item.shade)}"></span>
      <span class="result-text"><strong>${item.piece} ${item.shade.toLowerCase()}</strong><small>${reason(item.shade)}</small></span>
    </span><span class="arrow">＋</span>`;
  div.onclick=()=>{
    state.outfit[item.group]={piece:item.piece,shade:item.shade};
    updateFigure(); showToast(`${item.piece} ${item.shade.toLowerCase()} ajouté`);
  };
  els.results.appendChild(div);
}
function reason(shade){
  const fam=familyOfShade(shade);
  const neutral=['Blanc','Beige','Gris','Noir'];
  if(neutral.includes(fam)) return 'Accord facile et équilibré';
  if(fam===state.family) return 'Ton sur ton maîtrisé';
  if((fam==='Bleu'&&state.family==='Jaune')||(fam==='Jaune'&&state.family==='Bleu')) return 'Contraste net et harmonieux';
  if(fam==='Marron'||fam==='Vert') return 'Palette chaude et naturelle';
  return 'Contraste intéressant';
}

els.next.onclick=()=>{ if(state.step<4){state.step++;renderStep()} };
els.back.onclick=()=>{
  if(state.step===4){state.step=3;renderStep();return}
  if(state.step>0){state.step--;renderStep()}
};
function resetAll(){
  Object.assign(state,{step:0,piece:null,family:null,shade:null,target:null,outfit:{}});
  renderStep();
}
document.getElementById('resetTop').onclick=resetAll;
document.getElementById('savedBtn').onclick=()=>{
  const arr=JSON.parse(localStorage.getItem('stylia_saved')||'[]');
  showToast(arr.length?`${arr.length} tenue${arr.length>1?'s':''} enregistrée${arr.length>1?'s':''}`:'Aucune tenue enregistrée');
};
renderStep();
</script>
