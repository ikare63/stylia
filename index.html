<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e7">
<title>Stylia — Accordeur de tenue</title>
<style>
:root{
  --bg:#f5f0e7; --paper:#fffdf9; --ink:#1f1f1e; --muted:#77746e; --line:#ddd5c8;
  --soft:#eee7dc; --shadow:0 18px 50px rgba(58,48,34,.11); --r:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{color:inherit}
body{background:
 radial-gradient(circle at 8% 0%,rgba(255,255,255,.95),transparent 27rem),
 linear-gradient(180deg,#faf6ee,#f1eadf)}
.app{width:min(1040px,100%);margin:auto;min-height:100dvh;padding:14px 14px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:46px;height:46px;border-radius:16px;background:#20201f;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:850;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.brand h1{margin:0;font-size:28px;letter-spacing:-1px}
.brand small{display:block;margin-top:1px;color:var(--muted);font-size:12px}
.head-actions{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.68);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.card{background:rgba(255,253,249,.94);border:1px solid rgba(214,205,191,.92);border-radius:var(--r);box-shadow:var(--shadow)}
.quiz{padding:22px}
.progress{display:flex;gap:8px;margin-bottom:20px}
.progress i{height:5px;flex:1;border-radius:20px;background:#e7dfd3}
.progress i.on{background:#222}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:12px;color:var(--muted)}
h2{font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:-1.8px;margin:8px 0 7px}
.sub{margin:0 0 20px;color:var(--muted);font-size:15px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choice{border:1px solid var(--line);background:#fffdfa;border-radius:18px;min-height:74px;padding:14px;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.16s ease}
.choice:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(58,48,34,.08)}
.choice.selected{border-color:#222;box-shadow:inset 0 0 0 1px #222;background:#fff}
.choice .ico{width:36px;height:36px;display:grid;place-items:center;color:#262626;flex:0 0 auto}
.choice .ico svg{width:32px;height:32px}
.choice .txt strong{display:block;font-size:15px}
.choice .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.swatch{width:31px;height:31px;border-radius:50%;border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.26);flex:0 0 auto}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.back,.next{border:0;border-radius:15px;padding:13px 17px;font-weight:800;cursor:pointer}
.back{background:var(--soft)}
.next{background:#222;color:#fff;min-width:138px}
.next:disabled{opacity:.35;cursor:not-allowed}
.hidden{display:none!important}

/* compact preview during questionnaire */
.compact-preview{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 14px}
.cp-icon{width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.cp-icon svg{width:30px;height:30px}
.cp-text{min-width:0;flex:1}
.cp-text strong{display:block;font-size:14px}
.cp-text small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cp-swatch{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.14)}

/* results */
.results-page{display:none}
.results-page.show{display:block}
.results-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}
.results-head h2{margin-bottom:0}
.tabs{display:flex;gap:7px;background:#ece5da;padding:5px;border-radius:15px;width:max-content;max-width:100%;overflow:auto}
.tab{border:0;background:transparent;padding:9px 12px;border-radius:11px;font-weight:750;cursor:pointer;white-space:nowrap}
.tab.active{background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.result-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:16px}
.result-main{padding:18px}
.preview-card{padding:18px;position:sticky;top:12px;height:fit-content}
.figure-wrap{height:390px;border-radius:20px;background:linear-gradient(145deg,#faf7f0,#eee7db);position:relative;overflow:hidden;display:grid;place-items:center}
.figure-wrap:before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.7)}
.mannequin{position:relative;width:205px;height:365px;z-index:1}
.head{position:absolute;left:80px;top:6px;width:45px;height:52px;border-radius:45% 45% 48% 48%;background:#d7b392}
.neck{position:absolute;left:94px;top:54px;width:18px;height:24px;background:#d7b392;border-radius:4px}
.arm{position:absolute;top:82px;width:23px;height:132px;background:#d7b392;border-radius:15px}
.arm.l{left:30px;transform:rotate(5deg)} .arm.r{right:30px;transform:rotate(-5deg)}
.torso{position:absolute;left:53px;top:74px;width:100px;height:125px;border-radius:28px 28px 18px 18px;background:#eee;border:1px solid rgba(0,0,0,.08)}
.bottom{position:absolute;left:53px;top:188px;width:100px;height:82px;border-radius:9px 9px 17px 17px;background:#ddd;border:1px solid rgba(0,0,0,.08)}
.leg{position:absolute;top:256px;width:32px;height:95px;background:#d7b392;border-radius:10px}
.leg.l{left:63px}.leg.r{right:63px}
.shoe{position:absolute;top:338px;width:53px;height:23px;border-radius:18px 18px 8px 8px;background:#fafafa;border:1px solid rgba(0,0,0,.12)}
.shoe.l{left:43px}.shoe.r{right:43px}
.look-name{text-align:center;margin-top:13px}
.look-name strong{display:block;font-size:20px}
.look-name small{color:var(--muted)}
.looks{display:grid;gap:10px}
.look-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;cursor:pointer;transition:.16s}
.look-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(58,48,34,.08)}
.look-card.active{border-color:#222;box-shadow:inset 0 0 0 1px #222}
.look-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.look-title{display:flex;align-items:center;gap:10px}
.look-title b{font-size:16px}
.look-badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#f0e9df;color:#5e594f}
.parts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.part-pill{display:flex;align-items:center;gap:6px;border:1px solid #e4ddd2;background:#faf8f4;border-radius:999px;padding:7px 9px;font-size:12px}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.13)}
.why{color:var(--muted);font-size:13px;line-height:1.4;margin-top:10px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.small-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;font-size:12px;font-weight:750;cursor:pointer}
.small-btn.primary{background:#222;color:#fff;border-color:#222}
.section-title{font-size:16px;margin:18px 0 10px}
.replace-list{display:grid;gap:8px}
.replace-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.replace-card .rank{font-size:11px;color:var(--muted);font-weight:800}
.replace-card button{border:0;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer}
.saved-dressing{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:11px 12px;border-radius:14px;background:#f3eee6}
.switch{display:flex;align-items:center;gap:8px;font-size:13px}
.switch input{accent-color:#222}

/* drawer */
.drawer{position:fixed;inset:0;display:none;z-index:40}
.drawer.show{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,20,20,.34)}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(430px,92vw);background:#fbf8f2;padding:18px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.18)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h3{margin:0;font-size:24px}
.close{border:0;background:#ebe5da;width:38px;height:38px;border-radius:50%;cursor:pointer}
.saved-item{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;margin-top:10px}
.saved-item strong{display:block;margin-bottom:7px}
.empty{color:var(--muted);padding:24px 0;text-align:center}

/* toast */
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,28px);opacity:0;background:#222;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;transition:.22s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:820px){
 .app{padding:10px 10px 26px}
 .quiz{padding:18px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .result-layout{grid-template-columns:1fr}
 .preview-card{position:relative;top:auto;order:-1}
 .figure-wrap{height:300px}
 .mannequin{transform:scale(.78)}
 .results-head{display:block}
 .tabs{margin-top:12px}
}
@media(max-width:420px){
 .brand small{display:none}
 .brand h1{font-size:26px}
 .mark,.icon-btn{width:43px;height:43px}
 h2{font-size:31px}
 .choice{min-height:66px;padding:12px}
 .choice .ico{width:32px}
 .choice .ico svg{width:28px;height:28px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">S</div><div><h1>Stylia</h1><small>Accordeur de tenue</small></div></div>
  <div class="head-actions">
    <button class="icon-btn" id="wardrobeBtn" aria-label="Mon dressing" title="Mon dressing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 21V8a5 5 0 0 1 10 0v13"/><path d="M4 21h16M9 8h6M9 13h6"/></svg>
    </button>
    <button class="icon-btn" id="savedBtn" aria-label="Tenues enregistrées" title="Tenues enregistrées">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.5 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
    </button>
    <button class="icon-btn" id="resetBtn" aria-label="Recommencer" title="Recommencer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
</header>

<div id="questionnaire">
  <div id="compactPreview" class="card compact-preview hidden"></div>
  <section class="card quiz">
    <div class="progress" id="progress"></div>
    <div class="eyebrow" id="eyebrow">Étape 1</div>
    <h2 id="question">Qu’est-ce que tu veux porter aujourd’hui ?</h2>
    <p class="sub" id="sub">Choisis la pièce autour de laquelle construire ta tenue.</p>
    <div class="grid" id="choices"></div>
    <div class="nav">
      <button class="back hidden" id="back">← Retour</button>
      <button class="next hidden" id="next">Continuer</button>
    </div>
  </section>
</div>

<section id="resultsPage" class="results-page">
  <div class="results-head">
    <div><div class="eyebrow">Stylia te propose</div><h2 id="resultsTitle">Tes looks</h2></div>
    <div class="tabs"><button class="tab active" data-tab="looks">Looks</button><button class="tab" data-tab="replace">Pièce par pièce</button></div>
  </div>
  <div class="result-layout">
    <div class="card result-main">
      <div id="looksTab">
        <div class="looks" id="looks"></div>
      </div>
      <div id="replaceTab" class="hidden">
        <div id="replaceControls"></div>
        <div class="replace-list" id="replaceList"></div>
      </div>
      <div class="saved-dressing">
        <label class="switch"><input type="checkbox" id="ownedOnly"> Afficher seulement ce que j’ai dans mon dressing</label>
      </div>
    </div>
    <aside class="card preview-card">
      <div class="eyebrow">Aperçu</div>
      <div class="figure-wrap" style="margin-top:10px">
        <div class="mannequin">
          <div class="head"></div><div class="neck"></div><div class="arm l"></div><div class="arm r"></div>
          <div class="torso" id="torso"></div><div class="bottom" id="bottom"></div>
          <div class="leg l"></div><div class="leg r"></div><div class="shoe l" id="shoeL"></div><div class="shoe r" id="shoeR"></div>
        </div>
      </div>
      <div class="look-name"><strong id="lookName">Ton look</strong><small id="lookWhy"></small></div>
      <div class="parts" id="previewParts"></div>
      <div class="actions-row">
        <button class="small-btn primary" id="saveLook">♡ Enregistrer</button>
        <button class="small-btn" id="restartFromResults">Nouvelle tenue</button>
      </div>
    </aside>
  </div>
</section>
</div>

<div class="drawer" id="drawer">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet">
    <div class="sheet-head"><h3 id="drawerTitle">Mon dressing</h3><button class="close" id="closeDrawer">✕</button></div>
    <div id="drawerBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

'Rouille':['Blanc','Beige','Bleu','Vert','Marron','Noir'],
'Corail':['Blanc','Beige','Bleu','Gris','Vert'],
'Prune':['Blanc','Beige','Gris','Noir','Bleu','Rose'],
'Aubergine':['Blanc','Beige','Gris','Noir','Bleu','Vert'],
'Lilas':['Blanc','Gris','Beige','Bleu','Rose'],
'Lavande':['Blanc','Gris','Beige','Bleu','Rose'],
'Rose poudré':['Blanc','Beige','Gris','Bleu','Marron','Vert'],
'Vieux rose':['Blanc','Beige','Gris','Bleu','Marron','Vert'],
'Fuchsia':['Blanc','Noir','Gris','Bleu','Beige'],
'Saumon':['Blanc','Beige','Bleu','Gris','Vert']
};
const preferred={
'Blanc':['Blanc','Écru','Crème'],'Bleu':['Bleu marine','Bleu ciel','Denim','Bleu pétrole','Bleu roi'],
'Beige':['Lin','Sable','Taupe'],'Vert':['Kaki','Sauge','Olive','Forêt','Menthe'],
'Rouge':['Bordeaux','Brique','Grenat','Carmin','Écarlate'],'Noir':['Noir','Noir délavé'],
'Gris':['Gris clair','Anthracite','Gris moyen'],'Marron':['Camel','Cognac','Noisette','Chocolat'],
'Jaune':['Moutarde','Ocre','Jaune pâle','Doré','Citron'],'Rose':['Rose poudré','Vieux rose','Saumon','Fuchsia'],
'Violet':['Prune','Lavande','Lilas','Aubergine'],'Orange':['Terracotta','Rouille','Corail','Orange']
};

const state={step:0,piece:null,family:null,shade:null,style:'auto',looks:[],activeLook:0,replaceGroup:'top'};
const $=id=>document.getElementById(id);
function pieceById(id){return pieces.find(x=>x.id===id)}
function familyOfShade(s){return Object.keys(families).find(f=>Object.keys(families[f]).includes(s))}
function hex(s){const f=familyOfShade(s);return f?families[f][s]:'#e9e6df'}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function progress(){ $('progress').innerHTML=''; for(let i=0;i<4;i++){const e=document.createElement('i');if(i<=state.step)e.className='on';$('progress').appendChild(e)} }

function choiceCard(data, selected, click, useSwatch=false){
 const b=document.createElement('button'); b.className='choice'+(selected?' selected':'');
 const left=useSwatch?`<span class="swatch" style="background:${data.color}"></span>`:`<span class="ico">${data.icon||icon(data.id)}</span>`;
 b.innerHTML=left+`<span class="txt"><strong>${data.label}</strong>${data.desc?`<small>${data.desc}</small>`:''}</span>`;
 b.onclick=click; return b;
}

function renderCompact(){
 if(state.step===0 || !state.piece){$('compactPreview').classList.add('hidden');return}
 $('compactPreview').classList.remove('hidden');
 const p=pieceById(state.piece);
 const color=state.shade?hex(state.shade):(state.family?familyHex[state.family]:'#eee');
 $('compactPreview').innerHTML=`<div class="cp-icon">${icon(p.id)}</div><div class="cp-text"><strong>${p.label}</strong><small>${state.shade||state.family||'Couleur à choisir'}${state.style!=='auto'?' · '+styles.find(x=>x.id===state.style).label:''}</small></div><span class="cp-swatch" style="background:${color}"></span>`;
}

function autoNext(delay=170){setTimeout(()=>{state.step++;renderStep()},delay)}

function renderStep(){
 $('questionnaire').classList.remove('hidden'); $('resultsPage').classList.remove('show');
 progress(); renderCompact(); $('choices').innerHTML=''; $('next').classList.add('hidden'); $('back').classList.toggle('hidden',state.step===0);
 if(state.step===0){
  $('eyebrow').textContent='Étape 1'; $('question').textContent='Qu’est-ce que tu veux porter aujourd’hui ?'; $('sub').textContent='Choisis la pièce autour de laquelle construire ta tenue.';
  pieces.forEach(p=>$('choices').appendChild(choiceCard({...p,icon:icon(p.id)},state.piece===p.id,()=>{state.piece=p.id;state.family=null;state.shade=null;autoNext()})));
 }
 if(state.step===1){
  $('eyebrow').textContent='Étape 2'; $('question').textContent='Quelle est sa couleur ?'; $('sub').textContent='Choisis d’abord une couleur simple.';
  Object.keys(families).forEach(f=>$('choices').appendChild(choiceCard({label:f,color:familyHex[f]},state.family===f,()=>{state.family=f;state.shade=null;autoNext()},true)));
 }
 if(state.step===2){
  $('eyebrow').textContent='Étape 3'; $('question').textContent='Quelle nuance exactement ?'; $('sub').textContent=`Affinons le ${state.family.toLowerCase()}.`;
  Object.entries(families[state.family]).forEach(([s,c])=>$('choices').appendChild(choiceCard({label:s,color:c},state.shade===s,()=>{state.shade=s;autoNext()},true)));
 }
 if(state.step===3){
  $('eyebrow').textContent='Étape 4 · facultatif'; $('question').textContent='Quel genre de tenue tu veux ?'; $('sub').textContent='Choisis une ambiance, ou laisse Stylia décider.';
  styles.forEach(s=>$('choices').appendChild(choiceCard({id:'tshirt',label:s.label,desc:s.desc,icon:styleIcon(s.id)},state.style===s.id,()=>{state.style=s.id;setTimeout(showResults,150)})));
 }
}

function styleIcon(id){
 const icons={
  auto:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.7"><path d="m32 7 4 13 13 4-13 4-4 13-4-13-13-4 13-4 4-13Z"/><path d="m49 38 2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z"/></svg>`,
  simple:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.7"><circle cx="32" cy="32" r="18"/><path d="M22 32h20"/></svg>`,
  casual:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.7"><path d="M13 38c5-7 12-10 19-10s14 3 19 10"/><path d="M19 39v9h26v-9"/></svg>`,
  summer:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.7"><circle cx="32" cy="32" r="9"/><path d="M32 7v10M32 47v10M7 32h10M47 32h10M14 14l7 7M43 43l7 7M50 14l-7 7M21 43l-7 7"/></svg>`,
  smart:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.7"><path d="M22 9 11 16l5 34 13 3 3-25 3 25 13-3 5-34-11-7-10 12L22 9Z"/></svg>`,
  contrast:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.7"><circle cx="32" cy="32" r="20"/><path d="M32 12a20 20 0 0 1 0 40Z"/></svg>`
 }; return icons[id]||icons.auto;
}

function baseItem(){
 const p=pieceById(state.piece); return {group:p.group,piece:p.label,shade:state.shade};
}
function pickShade(fam,idx=0){return (preferred[fam]||Object.keys(families[fam]||{}))[idx] || (preferred[fam]||[])[0]}

function basePalette(){
 return pairings[state.shade]||['Blanc','Bleu','Beige','Noir','Gris','Marron','Vert'];
}

function buildLooks(){
 const base=baseItem(), fams=basePalette();
 const looks=[];
 function outfit(name,badge,why,mods={}){
  const o={top:null,bottom:null,outer:null,shoes:null,name,badge,why};
  o[base.group]=base;
  const f0=mods.f0||fams[0], f1=mods.f1||fams[1]||fams[0], f2=mods.f2||fams[2]||fams[0];
  if(!o.top) o.top={group:'top',piece:mods.topPiece||'T-shirt',shade:mods.topShade||pickShade(f0,0)};
  if(!o.bottom) o.bottom={group:'bottom',piece:mods.bottomPiece||'Pantalon / jean',shade:mods.bottomShade||pickShade(f1,0)};
  if(!o.outer && mods.outer!==false) o.outer={group:'outer',piece:mods.outerPiece||'Surchemise',shade:mods.outerShade||pickShade(f1,0)};
  if(!o.shoes) o.shoes={group:'shoes',piece:mods.shoePiece||'Baskets',shade:mods.shoeShade||pickShade(['Blanc','Beige'].includes(f2)?f2:'Blanc',0)};
  return o;
 }
 if(state.shade==='Moutarde'){
  looks.push(outfit('Simple','Facile', 'Le blanc calme le moutarde et le bleu marine structure la tenue.',
    {topShade:'Blanc',outerShade:'Bleu marine',bottomShade:'Bleu marine',shoeShade:'Blanc'}));
  looks.push(outfit('Été','Lumineux','Écru et bleu ciel gardent la tenue légère sans effacer le moutarde.',
    {topPiece:'Débardeur',topShade:'Écru',outer:false,bottomShade:'Bleu ciel',shoePiece:'Baskets',shoeShade:'Écru'}));
  looks.push(outfit('Plus habillé','Soigné','Le bleu marine et le cognac donnent un rendu plus habillé au moutarde.',
    {topPiece:'Chemise',topShade:'Blanc',outerPiece:'Veste',outerShade:'Bleu marine',bottomShade:'Bleu marine',shoePiece:'Mocassins',shoeShade:'Cognac'}));
  looks.push(outfit('Contraste','Marqué','Le bordeaux répond à la chaleur du moutarde, avec du blanc pour respirer.',
    {topPiece:'T-shirt',topShade:'Bordeaux',outer:false,bottomShade:'Noir',shoeShade:'Blanc'}));
 } else {
  looks.push(outfit('Simple','Facile','Une base neutre avec une seule couleur forte garde la tenue équilibrée.',
    {f0:fams[0],f1:fams[1],f2:'Blanc'}));
  looks.push(outfit('Décontracté','Quotidien','Des tons faciles et une surchemise donnent un ensemble simple à porter.',
    {topPiece:'T-shirt',outerPiece:'Surchemise',f0:fams[0],f1:fams[2]||fams[1],f2:'Blanc'}));
  looks.push(outfit('Plus habillé','Soigné','Une chemise et des tons plus profonds rendent l’ensemble plus net.',
    {topPiece:'Chemise',outerPiece:'Veste',f0:fams[0],f1:fams[1],shoePiece:'Mocassins',shoeShade:'Cognac'}));
  looks.push(outfit('Contraste','Marqué','Une couleur opposée ou plus sombre donne davantage de caractère.',
    {f0:fams[1]||fams[0],f1:fams[4]||'Noir',f2:'Blanc'}));
 }
 // style preference first
 const prefName={simple:'Simple',casual:'Décontracté',summer:'Été',smart:'Plus habillé',contrast:'Contraste'}[state.style];
 if(prefName){looks.sort((a,b)=>(a.name===prefName?-1:b.name===prefName?1:0))}
 return looks;
}

function showResults(){
 state.looks=buildLooks(); state.activeLook=0;
 $('questionnaire').classList.add('hidden'); $('resultsPage').classList.add('show');
 $('resultsTitle').textContent=`Avec ton ${pieceById(state.piece).label.toLowerCase()} ${state.shade.toLowerCase()}`;
 renderLooks(); renderPreview(); renderReplaceControls(); renderReplaceList();
 window.scrollTo({top:0,behavior:'smooth'});
}
function renderLooks(){
 $('looks').innerHTML='';
 state.looks.forEach((look,i)=>{
  const b=document.createElement('button'); b.className='look-card'+(i===state.activeLook?' active':'');
  const parts=['top','bottom','outer','shoes'].filter(k=>look[k]);
  b.innerHTML=`<div class="look-top"><div class="look-title"><b>${look.name}</b><span class="look-badge">${look.badge}</span></div><span>→</span></div>
  <div class="parts">${parts.map(k=>`<span class="part-pill"><span class="dot" style="background:${hex(look[k].shade)}"></span>${look[k].piece} · ${look[k].shade}</span>`).join('')}</div>
  <div class="why">${look.why}</div>`;
  b.onclick=()=>{state.activeLook=i;renderLooks();renderPreview();renderReplaceList()};
  $('looks').appendChild(b);
 });
}
function renderPreview(){
 const look=state.looks[state.activeLook]; if(!look)return;
 $('torso').style.background=look.top?hex(look.top.shade):'#eee';
 $('bottom').style.background=look.bottom?hex(look.bottom.shade):'#ddd';
 $('shoeL').style.background=$('shoeR').style.background=look.shoes?hex(look.shoes.shade):'#fafafa';
 $('torso').style.boxShadow=look.outer?`inset 10px 0 0 ${hex(look.outer.shade)},inset -10px 0 0 ${hex(look.outer.shade)}`:'none';
 $('lookName').textContent=look.name; $('lookWhy').textContent=look.why;
 $('previewParts').innerHTML=['top','bottom','outer','shoes'].filter(k=>look[k]).map(k=>`<span class="part-pill"><span class="dot" style="background:${hex(look[k].shade)}"></span>${look[k].piece} · ${look[k].shade}</span>`).join('');
}
function replacementCandidates(group){
 const fams=basePalette();
 let kinds=group==='top'?['T-shirt','Débardeur','Chemise','Polo']:group==='bottom'?['Pantalon / jean','Short']:group==='outer'?['Surchemise','Veste','Blouson']:['Baskets','Mocassins','Sandales'];
 let items=[];
 fams.slice(0,7).forEach((f,fi)=>{
   const shades=preferred[f]||[];
   const s=shades[0]; if(!s)return;
   kinds.forEach((p,pi)=>{
    if(group==='shoes'&&!['Blanc','Beige','Marron','Noir','Bleu','Gris'].includes(f))return;
    items.push({group,piece:p,shade:s,rank:fi*10+pi});
   });
 });
 if(state.shade==='Moutarde'&&group==='top')items=[
  ['T-shirt','Blanc'],['T-shirt','Bleu marine'],['Chemise','Écru'],['Chemise','Bleu ciel'],['Débardeur','Blanc'],['T-shirt','Kaki'],['T-shirt','Bordeaux']
 ].map((x,i)=>({group,piece:x[0],shade:x[1],rank:i}));
 return items.sort((a,b)=>a.rank-b.rank).slice(0,10);
}
function renderReplaceControls(){
 const groups=[['top','Haut'],['bottom','Bas'],['outer','Veste'],['shoes','Chaussures']];
 $('replaceControls').innerHTML=`<div class="tabs">${groups.map(([g,l])=>`<button class="tab ${state.replaceGroup===g?'active':''}" data-group="${g}">${l}</button>`).join('')}</div><h3 class="section-title">Remplacer la pièce</h3>`;
 $('replaceControls').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.replaceGroup=b.dataset.group;renderReplaceControls();renderReplaceList()});
}
function ownedKey(item){return `${item.group}|${item.piece}|${item.shade}`}
function getWardrobe(){return JSON.parse(localStorage.getItem('stylia_wardrobe')||'[]')}
function setWardrobe(a){localStorage.setItem('stylia_wardrobe',JSON.stringify(a))}
function isOwned(item){return getWardrobe().includes(ownedKey(item))}
function toggleOwned(item){
 let a=getWardrobe(),k=ownedKey(item); a=a.includes(k)?a.filter(x=>x!==k):[...a,k]; setWardrobe(a);
 toast(a.includes(k)?'Ajouté à ton dressing':'Retiré du dressing'); renderReplaceList();
}
function renderReplaceList(){
 const look=state.looks[state.activeLook]; if(!look)return;
 let items=replacementCandidates(state.replaceGroup);
 if($('ownedOnly').checked)items=items.filter(isOwned);
 $('replaceList').innerHTML='';
 if(!items.length){$('replaceList').innerHTML='<div class="empty">Aucune pièce correspondante dans ton dressing.</div>';return}
 items.forEach((it,i)=>{
  const d=document.createElement('div');d.className='replace-card';
  d.innerHTML=`<span class="rank">${i+1}</span><div><strong>${it.piece} ${it.shade.toLowerCase()}</strong><div style="margin-top:4px;font-size:12px;color:var(--muted)">${isOwned(it)?'✓ Dans mon dressing':'Pas encore dans mon dressing'}</div></div><div style="display:flex;gap:6px"><button class="own" style="background:#eee8de;color:#333">${isOwned(it)?'Retirer':'J’ai ça'}</button><button class="use">Choisir</button></div>`;
  d.querySelector('.own').onclick=()=>toggleOwned(it);
  d.querySelector('.use').onclick=()=>{look[state.replaceGroup]={...it};renderPreview();renderLooks();toast('Pièce remplacée')};
  $('replaceList').appendChild(d);
 });
}

/* tabs */
document.querySelectorAll('.tab[data-tab]').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab[data-tab]').forEach(x=>x.classList.toggle('active',x===t));
 $('looksTab').classList.toggle('hidden',t.dataset.tab!=='looks');
 $('replaceTab').classList.toggle('hidden',t.dataset.tab!=='replace');
});

/* save / drawers */
function saveCurrent(){
 const look=state.looks[state.activeLook]; if(!look)return;
 const a=JSON.parse(localStorage.getItem('stylia_saved')||'[]');
 a.unshift({date:new Date().toISOString(),name:look.name,why:look.why,look});
 localStorage.setItem('stylia_saved',JSON.stringify(a.slice(0,30))); toast('Tenue enregistrée');
}
function openDrawer(mode){
 $('drawer').classList.add('show');
 if(mode==='wardrobe'){
  $('drawerTitle').textContent='Mon dressing';
  const a=getWardrobe(); $('drawerBody').innerHTML=a.length?a.map(k=>{const [g,p,s]=k.split('|');return `<div class="saved-item"><strong>${p}</strong><div class="parts"><span class="part-pill"><span class="dot" style="background:${hex(s)}"></span>${s}</span></div></div>`}).join(''):'<div class="empty">Ton dressing est encore vide.<br>Dans « Pièce par pièce », utilise « J’ai ça ».</div>';
 }else{
  $('drawerTitle').textContent='Tenues enregistrées';
  const a=JSON.parse(localStorage.getItem('stylia_saved')||'[]');
  $('drawerBody').innerHTML=a.length?a.map(x=>`<div class="saved-item"><strong>${x.name}</strong><div class="parts">${['top','bottom','outer','shoes'].filter(k=>x.look[k]).map(k=>`<span class="part-pill"><span class="dot" style="background:${hex(x.look[k].shade)}"></span>${x.look[k].piece} · ${x.look[k].shade}</span>`).join('')}</div></div>`).join(''):'<div class="empty">Aucune tenue enregistrée pour le moment.</div>';
 }
}
function closeDrawer(){$('drawer').classList.remove('show')}

$('back').onclick=()=>{if(state.step>0){state.step--;renderStep()}};
$('resetBtn').onclick=resetAll; $('restartFromResults').onclick=resetAll;
$('saveLook').onclick=saveCurrent; $('savedBtn').onclick=()=>openDrawer('saved'); $('wardrobeBtn').onclick=()=>openDrawer('wardrobe');
$('closeDrawer').onclick=closeDrawer; $('backdrop').onclick=closeDrawer; $('ownedOnly').onchange=renderReplaceList;
function resetAll(){Object.assign(state,{step:0,piece:null,family:null,shade:null,style:'auto',looks:[],activeLook:0,replaceGroup:'top'});renderStep();window.scrollTo({top:0,behavior:'smooth'})}
renderStep();
</script>
</body>
</html>
